services:
  - type: web
    name: world-cup-winner
    runtime: node
    plan: free
    buildCommand: yarn install --frozen-lockfile --production
    startCommand: yarn start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: ./data
      - key: ALLOWED_ORIGINS
        value: https://assaf-itzikson.github.io
      - key: LIVE_TRANSPORT
        value: poll
