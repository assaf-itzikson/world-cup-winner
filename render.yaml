services:
  - type: web
    name: world-cup-winner
    runtime: node
    plan: starter
    buildCommand: yarn install --frozen-lockfile --production
    startCommand: yarn start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: draw-results
      mountPath: /var/data
      sizeGB: 1
