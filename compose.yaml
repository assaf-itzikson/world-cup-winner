services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DATA_DIR: /app/data
      PORT: "3000"
      LIVE_TRANSPORT: poll
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://assaf-itzikson.github.io}
    volumes:
      - draw-data:/app/data
    ports:
      - "127.0.0.1:${DOCKER_PORT:-3000}:3000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  draw-data:
